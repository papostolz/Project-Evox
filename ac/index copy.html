    <div id="timePopup" class="popup">
        <div class="apple-picker-wrapper">
            <label id="ac-schedule-label" class="field-label">-</label>
            <div class="display-box" id="display-container">
                <input type="text" id="display" value="Select Date & Time" readonly>
                <span class="chevron"></span>
            </div>

            <div id="picker-container" class="picker-card">
                <div class="input-group">
                    <small>DATE</small>
                    <input type="date" id="date-input">
                </div>
                <div class="input-group">
                    <small>TIME</small>
                    <input type="time" id="time-input">
                </div>
                <button id="confirm-btn">Done</button>
            </div>
        </div>
        <div class="spinner" id="spinner2" style="opacity: 0;transition: opacity 0.3s ease;">
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>

            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
        </div>
    </div>
